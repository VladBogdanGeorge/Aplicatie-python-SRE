name: Test API

on:
  workflow_dispatch:
    inputs:
      NUME:
        description: 'Nume'
        required: true
        default: 'Popescu'
      PRENUME:
        description: 'Prenume'
        required: true
        default: 'Ion'
      OPERATIE:
        description: 'Operatie (ADD/DELETE/GET)'
        required: true
        default: 'ADD'

jobs:
  test_api:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: bogdan
          POSTGRES_USER: bogdan
          POSTGRES_PASSWORD: bogdanpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bogdan"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      app:
        image: zxlm4628/tema-interviu:1.0.7
        env:
          DB_NAME: bogdan
          DB_USER: bogdan
          DB_PASSWORD: bogdanpass
          DB_HOST: db
          DB_PORT: 5432
        ports:
          - 8000:8000
        # FARA healthcheck la app pentru debug

    steps:
      - name: Așteaptă ca serviciile să fie gata
        run: sleep 20

      - name: Debug curl /users și /
        run: |
          curl -v http://localhost:8000/users || true
          curl -v http://localhost:8000/ || true

      - name: Execută operația pe API
        run: |
          if [ "${{ github.event.inputs.OPERATIE }}" = "ADD" ]; then
            curl -X POST -H "Content-Type: application/json" -d "{\"nume\":\"${{ github.event.inputs.NUME }}\",\"prenume\":\"${{ github.event.inputs.PRENUME }}\"}" http://localhost:8000/users
          elif [ "${{ github.event.inputs.OPERATIE }}" = "DELETE" ]; then
            curl -X DELETE -H "Content-Type: application/json" -d "{\"nume\":\"${{ github.event.inputs.NUME }}\",\"prenume\":\"${{ github.event.inputs.PRENUME }}\"}" http://localhost:8000/users
          elif [ "${{ github.event.inputs.OPERATIE }}" = "GET" ]; then
            curl http://localhost:8000/users
          fi
