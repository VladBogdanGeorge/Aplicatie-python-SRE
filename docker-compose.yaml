version: '3'

services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_DB: bogdandb
      POSTGRES_USER: bogdan
      POSTGRES_PASSWORD: bogdanpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/

  app:
    image: zxlm4628/tema-interviu:1.0.6
    container_name: python_app_container
    environment:
      - DB_NAME=bogdandb
      - DB_USER=bogdan
      - DB_PASSWORD=bogdanpass
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      - postgres
    ports:
      - "8000:8000"

volumes:
  postgres_data: # By default, the volume is located at /var/lib/docker/volumes
